name: Build for FreeBSD

on:
  push:
    branches:
      - "**"
  pull_request:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_GENERATE_ASPNET_CERTIFICATE: false

jobs:
  build_freebsd:
    runs-on: ubuntu-latest
    name: Build on FreeBSD
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            # 安装基本依赖
            pkg update
            pkg upgrade -y
            pkg install -y curl bash npm node python3 git
            
            # 显示环境信息
            echo "Current directory: $(pwd)"
            echo "PATH: $PATH"
            echo "Shell: $SHELL"
            
            # 安装 .NET SDK
            curl -sSL https://dot.net/v1/dotnet-install.sh > dotnet-install.sh
            chmod +x dotnet-install.sh
            ./dotnet-install.sh --channel 8.0
            
            # 设置环境变量
            DOTNET_ROOT=$HOME/.dotnet
            PATH=$PATH:$DOTNET_ROOT:$DOTNET_ROOT/tools
            echo "export DOTNET_ROOT=$DOTNET_ROOT" >> ~/.profile
            echo "export PATH=$PATH" >> ~/.profile
            . ~/.profile

          run: |
            # 显示环境信息
            pwd
            ls -la
            echo "PATH: $PATH"
            which dotnet
            which npm
            
            # 构建 WebUI
            cd webui
            echo "Building WebUI in $(pwd)"
            /usr/local/bin/npm install
            /usr/local/bin/npm run build
            cd ..
            
            # 构建 .NET 项目
            $HOME/.dotnet/dotnet --info
            $HOME/.dotnet/dotnet restore
            
            # Debug build
            $HOME/.dotnet/dotnet publish -c Debug BililiveRecorder.Cli/BililiveRecorder.Cli.csproj \
              --self-contained true \
              /p:PublishSingleFile=true \
              /p:PublishTrimmed=true
            
            # Release build
            $HOME/.dotnet/dotnet publish -c Release BililiveRecorder.Cli/BililiveRecorder.Cli.csproj \
              --self-contained true \
              /p:PublishSingleFile=true \
              /p:PublishTrimmed=true

      - name: Upload Artifacts - Debug
        uses: actions/upload-artifact@v3
        with:
          name: CLI-FreeBSD-Debug
          path: BililiveRecorder.Cli/bin/Debug/net*/publish/
          if-no-files-found: error

      - name: Upload Artifacts - Release
        uses: actions/upload-artifact@v3
        with:
          name: CLI-FreeBSD-Release
          path: BililiveRecorder.Cli/bin/Release/net*/publish/
          if-no-files-found: error
